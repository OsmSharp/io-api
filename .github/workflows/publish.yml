name: Publish Package
on:
  push:
    branches:
      - main
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Run Unit Test
      run: dotnet test
    - name: Build Solution
      run: dotnet build --configuration Release
    - name: NuGet login (OIDC trusted publishing)
      uses: NuGet/login@v1
      id: nuget-login
      with:
        user: xivk
    - name: Nuget Publish
      if: success()
      run: dotnet nuget push --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} ./OsmSharp.IO.API/bin/Release/*.nupkg
    - name: Create GitHub Release
      if: success()
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(dotnet msbuild ./OsmSharp.IO.API/OsmSharp.IO.API.csproj -getProperty:Version)
        gh release create "v$VERSION" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
